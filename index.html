<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Connect with Me ✨</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            position: relative;
        }

        /* decorative animated background shapes */
        body::before {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            background: rgba(255,255,255,0.1);
            border-radius: 50%;
            top: 10%;
            left: -100px;
            filter: blur(60px);
        }

        body::after {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            background: rgba(255,255,255,0.08);
            border-radius: 50%;
            bottom: 10%;
            right: -100px;
            filter: blur(80px);
        }

        .card {
            max-width: 580px;
            width: 100%;
            background: rgba(255, 255, 255, 0.97);
            backdrop-filter: blur(0px);
            border-radius: 2.5rem;
            padding: 2.2rem 2rem 2.8rem;
            box-shadow: 0 30px 60px -20px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(255,255,255,0.3);
            text-align: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            position: relative;
            z-index: 2;
        }

        .card:hover {
            transform: translateY(-6px);
            box-shadow: 0 40px 70px -20px rgba(0, 0, 0, 0.5);
        }

        /* custom avatar with gradient border */
        .avatar-wrapper {
            width: 120px;
            height: 120px;
            margin: 0 auto 1.2rem;
            background: linear-gradient(135deg, #667eea, #764ba2, #f093fb);
            border-radius: 50%;
            padding: 4px;
        }

        .avatar {
            width: 100%;
            height: 100%;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3.2rem;
            font-weight: 600;
            background: linear-gradient(145deg, #fff, #f8f9ff);
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea, #764ba2);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            margin-bottom: 0.3rem;
            letter-spacing: -0.5px;
        }

        .tagline {
            color: #5a4b6e;
            margin-bottom: 0.8rem;
            font-size: 1rem;
            font-weight: 500;
            background: #f0eef7;
            display: inline-block;
            padding: 0.3rem 1.2rem;
            border-radius: 40px;
            font-size: 0.85rem;
        }

        .bio {
            color: #4a3a5e;
            font-size: 0.9rem;
            margin-bottom: 1.8rem;
            max-width: 80%;
            margin-left: auto;
            margin-right: auto;
            line-height: 1.4;
        }

        .social-grid {
            display: flex;
            flex-direction: column;
            gap: 0.9rem;
            margin: 1.5rem 0 2rem;
        }

        /* platform-specific gradient hover effects */
        .social-link {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #ffffff;
            padding: 0.9rem 1.3rem;
            border-radius: 80px;
            text-decoration: none;
            color: #1e1a2f;
            font-weight: 600;
            transition: all 0.25s;
            border: 1px solid #e9e3f0;
            box-shadow: 0 3px 8px rgba(0,0,0,0.02);
            position: relative;
            overflow: hidden;
        }

        .social-link::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(120deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.4) 50%, rgba(255,255,255,0) 100%);
            transform: translateX(-100%);
            transition: transform 0.4s ease;
        }

        .social-link:hover::before {
            transform: translateX(100%);
        }

        .social-link:hover {
            transform: translateX(8px) scale(1.01);
            border-color: transparent;
        }

        /* instagram brand */
        .social-link.instagram:hover {
            background: linear-gradient(45deg, #f09433, #d62976, #962fbf);
            color: white;
            box-shadow: 0 12px 20px -12px #d6297680;
        }
        /* twitter brand */
        .social-link.twitter:hover {
            background: #1DA1F2;
            color: white;
            box-shadow: 0 12px 20px -12px #1DA1F2;
        }
        /* discord brand */
        .social-link.discord:hover {
            background: #5865F2;
            color: white;
            box-shadow: 0 12px 20px -12px #5865F2;
        }
        /* snapchat brand */
        .social-link.snapchat:hover {
            background: #FFFC00;
            color: #1a1a1a;
            box-shadow: 0 12px 20px -12px #FFFC00;
        }
        /* youtube brand */
        .social-link.youtube:hover {
            background: #FF0000;
            color: white;
            box-shadow: 0 12px 20px -12px #FF0000;
        }
        /* tiktok brand */
        .social-link.tiktok:hover {
            background: #000000;
            color: white;
            box-shadow: 0 12px 20px -12px #000000;
        }

        .social-left {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .social-icon {
            font-size: 1.7rem;
            width: 32px;
            text-align: center;
        }

        .social-name {
            font-size: 1rem;
            letter-spacing: -0.2px;
        }

        .arrow {
            font-size: 1.2rem;
            transition: transform 0.2s;
            opacity: 0.7;
        }

        .social-link:hover .arrow {
            transform: translateX(5px);
            opacity: 1;
        }

        .contact-email {
            margin-top: 1rem;
            background: linear-gradient(135deg, #f5f0ff, #ede7f6);
            border-radius: 60px;
            padding: 0.9rem 1rem;
            font-size: 0.9rem;
            color: #2d2440;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            border: 1px solid #ddd0f0;
            font-weight: 500;
        }

        .contact-email a {
            color: #764ba2;
            text-decoration: none;
            font-weight: 700;
            word-break: break-all;
            transition: color 0.2s;
        }

        .contact-email a:hover {
            color: #4a2c73;
            text-decoration: underline;
        }

        /* custom status badge */
        .status-badge {
            background: #e6f7e6;
            color: #2e7d32;
            border-radius: 40px;
            padding: 0.2rem 1rem;
            font-size: 0.7rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            margin-top: 1rem;
        }

        .status-badge span {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #2e7d32;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.4; transform: scale(0.8);}
            100% { opacity: 1; transform: scale(1.2);}
        }

        footer {
            margin-top: 1.8rem;
            font-size: 0.7rem;
            color: #8a7a9e;
        }

        hr {
            margin: 1rem 0 0.5rem;
            border: 0;
            height: 1px;
            background: linear-gradient(to right, transparent, #d9cce8, transparent);
        }

        @media (max-width: 480px) {
            .card {
                padding: 1.5rem;
            }
            .social-link {
                padding: 0.7rem 1rem;
            }
            .bio {
                max-width: 95%;
            }
            h1 {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <!-- Avatar with gradient ring -->
        <div class="avatar-wrapper">
            <div class="avatar">
                🌟
            </div>
        </div>

        <h1>Alex Morgan</h1>
        <div class="tagline">✨ digital creator | streamer ✨</div>
        <div class="bio">
            building community • sharing vibes • let's connect
        </div>

        <div class="social-grid">
            <!-- Instagram -->
            <a href="https://instagram.com/YOUR_USERNAME" class="social-link instagram" target="_blank" rel="noopener noreferrer">
                <div class="social-left">
                    <span class="social-icon">📸</span>
                    <span class="social-name">Instagram</span>
                </div>
                <span class="arrow">→</span>
            </a>

            <!-- Twitter / X -->
            <a href="https://twitter.com/YOUR_USERNAME" class="social-link twitter" target="_blank" rel="noopener noreferrer">
                <div class="social-left">
                    <span class="social-icon">🐦</span>
                    <span class="social-name">X (Twitter)</span>
                </div>
                <span class="arrow">→</span>
            </a>

            <!-- Discord (new) -->
            <a href="https://discord.gg/YOUR_INVITE_CODE" class="social-link discord" target="_blank" rel="noopener noreferrer">
                <div class="social-left">
                    <span class="social-icon">🎮</span>
                    <span class="social-name">Discord</span>
                </div>
                <span class="arrow">→</span>
            </a>

            <!-- Snapchat (new) -->
            <a href="https://snapchat.com/add/YOUR_USERNAME" class="social-link snapchat" target="_blank" rel="noopener noreferrer">
                <div class="social-left">
                    <span class="social-icon">👻</span>
                    <span class="social-name">Snapchat</span>
                </div>
                <span class="arrow">→</span>
            </a>

            <!-- TikTok -->
            <a href="https://tiktok.com/@YOUR_USERNAME" class="social-link tiktok" target="_blank" rel="noopener noreferrer">
                <div class="social-left">
                    <span class="social-icon">🎵</span>
                    <span class="social-name">TikTok</span>
                </div>
                <span class="arrow">→</span>
            </a>

            <!-- YouTube -->
            <a href="https://youtube.com/@YOUR_USERNAME" class="social-link youtube" target="_blank" rel="noopener noreferrer">
                <div class="social-left">
                    <span class="social-icon">📺</span>
                    <span class="social-name">YouTube</span>
                </div>
                <span class="arrow">→</span>
            </a>
        </div>

        <!-- Email contact (kept for professionalism) -->
        <div class="contact-email">
            <span>✉️</span>
            <a href="mailto:hello@alexmorgan.com">hello@alexmorgan.com</a>
        </div>

        <!-- live status badge (fun personal touch) -->
        <div class="status-badge">
            <span></span> active daily • replies within 24h
        </div>

        <hr>
        <footer>
            💬 find me everywhere @alexmorgan — let's create something cool
        </footer>
    </div>
</body>
</html>
